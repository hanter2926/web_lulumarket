{% extends 'base/base.html' %}

{% block title %}OTP Login{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; padding: 24px; border: 1px solid #e5e7eb; border-radius: 12px; background: #fff;">
    <h2>Login with Phone OTP</h2>
    {% if message %}
        <p style="color: #166534; background: #ecfdf5; padding: 10px; border-radius: 8px;">{{ message }}</p>
    {% endif %}
    <form method="post" action="{% url 'request_otp' %}">
        {% csrf_token %}
        <div style="margin-bottom: 16px;">
            <label for="phone">Phone Number</label><br>
            <input type="text" id="phone" name="phone" value="{{ phone|default:'' }}" placeholder="e.g. 9876543210" style="width: 100%; padding: 10px; margin-top: 6px;">
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background: #111827; color: #fff; border: none; border-radius: 8px; cursor: pointer;">
            Send OTP
        </button>
    </form>

    <hr style="margin: 24px 0;">

    <form method="post" action="{% url 'verify_otp' %}">
        {% csrf_token %}
        <div style="margin-bottom: 16px;">
            <label for="otp_phone">Phone Number</label><br>
            <input type="text" id="otp_phone" name="phone" value="{{ phone|default:'' }}" placeholder="Same phone number" style="width: 100%; padding: 10px; margin-top: 6px;">
        </div>
        <div style="margin-bottom: 16px;">
            <label for="otp">OTP</label><br>
            <input type="text" id="otp" name="otp" maxlength="6" placeholder="Enter 6-digit OTP" style="width: 100%; padding: 10px; margin-top: 6px;">
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer;">
            Verify OTP
        </button>
    </form>
</div>
{% endblock %}
