{% extends 'base/base.html' %}
{% block title %}Assign Delivery{% endblock %}

{% block content %}
<div class="container py-5">
    <h2 class="mb-4">Assign Delivery</h2>
    <div class="card p-4">
        <p><strong>Order:</strong> {{ order.order_number }}</p>
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="store">Store</label>
                    <select id="store" name="store" class="form-select" required>
                        <option value="">Select store</option>
                        {% for store in stores %}
                            <option value="{{ store.pk }}">{{ store.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="worker">Worker</label>
                    <select id="worker" name="worker" class="form-select" required>
                        <option value="">Select worker</option>
                        {% for worker in workers %}
                            <option value="{{ worker.pk }}">{{ worker.user.email }} ({{ worker.store.name }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Assign</button>
                <a href="{% url 'sellers:shopkeeper_assignments' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
