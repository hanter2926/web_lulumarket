{% extends 'base/base.html' %}
{% block title %}{% if is_edit %}Edit Worker{% else %}Add Worker{% endif %}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>{% if is_edit %}Edit Worker{% else %}Add Worker{% endif %}</h2>
        <a href="{% url 'sellers:shopkeeper_workers' %}" class="btn btn-outline-primary">Back</a>
    </div>

    <form method="post" class="card p-4">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{% if worker %}{{ worker.user.email }}{% endif %}" {% if is_edit %}readonly{% else %}required{% endif %}>
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control" value="{% if worker %}{{ worker.phone }}{% endif %}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Store</label>
                <select name="store" class="form-select" required>
                    <option value="">Select store</option>
                    {% for store in stores %}
                        <option value="{{ store.pk }}" {% if worker and worker.store_id == store.pk %}selected{% endif %}>{{ store.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    {% for value, label in worker.STATUS_CHOICES %}
                        <option value="{{ value }}" {% if worker and worker.status == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            {% if is_edit %}
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="is_available" id="is_available" {% if worker and worker.is_available %}checked{% endif %}>
                    <label class="form-check-label" for="is_available">Available</label>
                </div>
            </div>
            {% endif %}
        </div>
        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'sellers:shopkeeper_workers' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
