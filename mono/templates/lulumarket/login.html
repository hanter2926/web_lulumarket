{% extends 'lulumarket/base.html' %}

{% block title %}Login | Lulumarket{% endblock %}

{% block content %}

<section class="hero">
    <div class="auth-card">
        <div class="card-icon">👋</div>
        <h1>Welcome back</h1>
        <p class="muted">Sign in to continue shopping with Lulumarket.</p>

        <form method="post" class="form-stack">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button class="button" type="submit">Log in</button>
        </form>

        <p class="account-link">
            New here? <a href="{% url 'register' %}">Create an account</a>.
        </p>
    </div>
</section>

{% endblock %}
