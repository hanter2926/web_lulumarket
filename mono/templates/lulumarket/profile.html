{% extends 'lulumarket/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}">
{% endblock %}

{% block title %}Account | Lulumarket{% endblock %}

{% block content %}

<section class="hero">

    <div class="container">

        <div class="profile-card">
            <h1 class="profile-title">Your Account</h1>
            <p class="muted profile-subtitle">Manage your profile and account details.</p>

            <form method="post" novalidate>
                {% csrf_token %}

                <div class="form-body">
                    {{ form.as_p }}
                </div>

                <div class="form-actions">
                    <button class="button" type="submit">Save Profile</button>
                </div>
            </form>

            <div class="actions actions-centered">
                <a href="{% url 'order_history' %}">Order History</a>
                <a href="{% url 'add_address' %}">Add Address</a>
            </div>
        </div>

    </div>

</section>

{% endblock %}
