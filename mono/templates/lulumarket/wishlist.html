{% extends 'lulumarket/base.html' %}{% block title %}Wishlist | Lulumarket{% endblock %}{% block content %}<div class="section-head"><h1>Your wishlist</h1></div><div class="grid">{% for product in wishlist.products.all %}{% include 'lulumarket/_product_card.html' %}<form method="post" action="{% url 'remove_from_wishlist' product.pk %}">{% csrf_token %}<button type="submit">Remove</button></form>{% empty %}<p class="muted">Your wishlist is empty.</p>{% endfor %}</div>{% endblock %}
