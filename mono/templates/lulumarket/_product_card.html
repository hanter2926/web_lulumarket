<article class="product-card">{% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }}">{% endif %}<h3><a href="{% url 'product_detail' product.pk %}">{{ product.name }}</a></h3><div class="price">₹{{ product.price }}</div>{% if product.stock_quantity == 0 %}<p class="muted">Out of stock</p>{% else %}<form class="actions" method="post" action="{% url 'add_to_cart' product.pk %}">{% csrf_token %}<input type="hidden" name="quantity" value="1"><button class="button" type="submit">Add to cart</button></form>{% endif %}</article>
