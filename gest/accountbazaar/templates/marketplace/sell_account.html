{% extends "base.html" %}{% load static %}{% block title %}Sell Account | AccountBazaar{% endblock %}{% block extra_css %}<link rel="stylesheet" href="{% static 'css/marketplace.css' %}">{% endblock %}{% block content %}<section class="page-section container"><div class="glass panel"><p class="eyebrow">Seller flow</p><h1>Sell your account</h1><form method="post" enctype="multipart/form-data">{% csrf_token %}{% if form %}{{ form.as_p }}{% else %}<div class="form-field"><label for="account-title">Account title</label><input id="account-title" name="title" required></div><div class="form-field"><label for="account-category">Category</label><select id="account-category" name="category" required><option value="gaming">Gaming</option><option value="social">Instagram / Social</option><option value="youtube">YouTube</option><option value="software">Software</option></select></div><div class="form-field"><label for="platform">Platform</label><input id="platform" name="platform"></div><div class="form-field"><label for="handle">Username or handle</label><input id="handle" name="handle"></div><div class="form-field"><label for="price">Price</label><input id="price" name="price" type="number" min="0" step="0.01" required></div><div class="form-field"><label for="stats">Account statistics</label><textarea id="stats" name="stats" rows="3"></textarea></div><div class="form-field"><label for="description">Description</label><textarea id="description" name="description" rows="6" required></textarea></div><div class="form-field"><label for="screenshot">Screenshot</label><input id="screenshot" name="screenshot" type="file" accept="image/*"></div>{% endif %}<button class="button" type="submit">Submit for verification</button></form></div></section>{% endblock %}
