<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AccountBazaar</title>
  <style>
    :root { --ink:#17212b; --paper:#f5f7f8; --navy:#17324d; --teal:#1b817b; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); background:var(--paper); font:16px/1.5 Georgia, serif; } main { width:min(900px, calc(100% - 32px)); margin:14vh auto; } .eyebrow { color:var(--teal); font:700 12px 'Trebuchet MS', sans-serif; letter-spacing:2px; text-transform:uppercase; } h1 { max-width:680px; margin:15px 0; color:var(--navy); font:700 clamp(38px, 7vw, 74px)/.98 'Trebuchet MS', sans-serif; } p { max-width:540px; color:#60717d; font-size:19px; } a { display:inline-block; margin-top:18px; padding:12px 17px; color:#fff; background:var(--teal); text-decoration:none; font:700 13px 'Trebuchet MS', sans-serif; } a:hover { background:var(--navy); }
  </style>
</head>
<body><main><div class="eyebrow">AccountBazaar</div><h1>Trade with a clearer view.</h1><p>Browse verified account listings and publish your own offer through the marketplace.</p><a href="{% url 'marketplace:listings' %}">Open marketplace</a></main></body>
</html>
