<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notifications | AccountBazaar</title><style>body{margin:0;background:#f5f7f8;color:#17212b;font:15px Georgia,serif}main{width:min(760px,calc(100% - 32px));margin:40px auto}h1{color:#17324d;font:700 32px 'Trebuchet MS',sans-serif}.notice{background:#fff;border:1px solid #e4e9ec;padding:16px;margin:10px 0}.unread{border-left:4px solid #1b817b}.meta{color:#71808d;font:12px 'Trebuchet MS',sans-serif}button{border:0;background:#1b817b;color:#fff;padding:7px 10px;font-weight:700}</style></head><body><main><h1>Notifications <small>({{ unread_count }} unread)</small></h1>{% for notification in notifications %}<article class="notice{% if not notification.is_read %} unread{% endif %}"><h2>{{ notification.title }}</h2><p>{{ notification.body }}</p><div class="meta">{{ notification.created_at|date:"M j, Y H:i" }}</div>{% if not notification.is_read %}<form method="post" action="{% url 'notifications:mark-read' notification.id %}">{% csrf_token %}<button type="submit">Mark as read</button></form>{% endif %}</article>{% empty %}<p>No notifications yet.</p>{% endfor %}</main></body></html>
