[package]
name = "suhana-image-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pdfium-render = { version = "0.9.5", default-features = false, features = ["image_025", "pdfium_8125"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
